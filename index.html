<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<title>Implantação RioSul · WPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0c0d0f;--sf:#15171a;--s2:#1c1f23;--bd:#2a2e33;--tx:#eceef0;--mu:#9097a0;--ac:#E8420A;--ok:#2fb36d;--pr:#4c8dff;--wt:#d9a21b;--er:#f26d6d;color-scheme:dark}
[data-theme=light]{--bg:#f5f5f4;--sf:#fff;--s2:#f0f0ee;--bd:#e2e2df;--tx:#17181a;--mu:#666b73;--ok:#1f9a58;--pr:#2563eb;--wt:#a87405;--er:#c0392b;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:calc(106px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.mono,.sc,#pct,.big{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;color:inherit}
#hd{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.r1{display:flex;align-items:center;gap:12px;padding:0 14px;height:56px}
.r1 img{height:28px;width:auto}
.r1 h1{flex:1;margin:0;font-size:16px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pct{font-size:15px;font-weight:700}
.tg{all:unset;cursor:pointer;display:grid;place-items:center;width:36px;height:36px;border-radius:8px;color:var(--mu)}
.tg:hover{background:var(--s2)}
.hp{height:3px;background:var(--bd)}.hp i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
nav{display:flex;padding:0 6px}
nav button{all:unset;box-sizing:border-box;flex:1;text-align:center;padding:12px 4px;font-size:14px;font-weight:500;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent}
nav button[aria-current=page]{color:var(--tx);border-color:var(--ac);font-weight:600}
nav button:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
main{max-width:720px;margin:0 auto;padding:14px}
.v[hidden],#gate[hidden],#sheet[hidden],#toast[hidden],#ro[hidden]{display:none}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mu)}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.cfg{grid-template-columns:1fr}}
.cfg label,#gate label,#sheet label{display:block;font-size:12px;font-weight:500;color:var(--mu)}
input[type=text],input[type=email],input[type=search],input[type=date],textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
input[aria-invalid=true]{border-color:var(--er)}
.er{color:var(--er);font-size:13px;min-height:0;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bar input{margin:0;flex:1 1 160px}
.chip{all:unset;cursor:pointer;box-sizing:border-box;padding:0 12px;height:42px;display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:8px;font-size:14px;font-weight:500;color:var(--mu)}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.tools{display:flex;align-items:center;gap:14px;margin:0 2px 10px;font-size:13px;color:var(--mu)}
.tools button{all:unset;cursor:pointer;color:var(--mu);text-decoration:underline;text-underline-offset:3px}
.live{margin-left:auto;display:flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mu)}
.live[data-s=ok]::before{background:var(--ok)}.live[data-s=err]::before{background:var(--er)}
#ro{display:flex;align-items:center;gap:12px;justify-content:space-between;font-size:14px;color:var(--mu)}
details{background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{padding:14px;cursor:pointer;list-style:none;position:relative}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline-offset:-2px}
.sh{display:flex;align-items:center;gap:10px;font-weight:600}
.sh .nm{flex:1}
.sc{font-size:12px;font-weight:500;color:var(--mu)}
.sh::after{content:"";width:8px;height:8px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;margin:-3px 4px 0 0}
details[open] .sh::after{transform:rotate(-135deg);margin-top:3px}
.mb{height:3px;background:var(--bd);border-radius:9px;margin-top:10px;overflow:hidden}
.mb i,.pb i{display:block;height:100%;background:var(--ok);transition:width .3s}
.it{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--bd);min-height:56px}
.ck{all:unset;box-sizing:border-box;width:28px;height:28px;border-radius:50%;border:2px solid var(--mu);position:relative;cursor:pointer;flex:none}
.ck:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.it.a .ck{border-color:var(--pr);background:linear-gradient(90deg,var(--pr) 50%,transparent 50%)}
.it.w .ck{border-color:var(--wt)}.it.w .ck::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--wt)}
.it.d .ck{background:var(--ok);border-color:var(--ok)}
.it.d .ck::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.it.n .ck{border-style:dashed;opacity:.55}
.it .t{flex:1;min-width:0;font-size:15.5px}
.it.d .t,.it.n .t{color:var(--mu)}
.it.d .tl{text-decoration:line-through}
.w{display:block;color:var(--mu);font-size:12px;margin-top:1px}
.it select{font:inherit;font-size:13px;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:7px 6px;max-width:128px}
.it.hide{display:none}
.pb{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:10px 0}
.big{font-size:44px;font-weight:700;line-height:1}
.mut{color:var(--mu);font-size:14px}
.st4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.st4 div{background:var(--s2);border-radius:8px;padding:10px;font-size:12px;color:var(--mu)}
.st4 b{display:block;font-family:"JetBrains Mono",monospace;font-size:20px;color:var(--tx)}
.sr{display:flex;justify-content:space-between;font-size:14px;margin-top:10px}
.li{padding:11px 0;border-top:1px solid var(--bd);font-size:15px}
.li:first-of-type{border:0}
.li small{display:block;color:var(--mu);font-size:12.5px;margin-top:1px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mu);margin-left:8px}
.tag.ok{background:var(--ok);color:#fff}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--ac);color:#fff;padding:0 18px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-weight:600}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#gate,#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:0}
#gate form,#sheet form{width:100%;max-width:440px;background:var(--sf);border:1px solid var(--bd);border-radius:16px 16px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:560px){#gate,#sheet{align-items:center;padding:20px}#gate form,#sheet form{border-radius:16px}}
#gate img{height:30px;margin-bottom:14px}
#gate h2,#sheet h2{margin:0 0 6px;font-size:20px}
#gate label,#sheet label{margin:14px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:14px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:14px;width:max-content;max-width:calc(100% - 28px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
#toast button{all:unset;cursor:pointer;font-weight:700;color:var(--ac);padding:4px 2px}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.ch>span{display:contents}
.chip2{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mu)}
.chip2.late{background:var(--er);color:#fff;font-weight:600}
.nt{flex-basis:100%;font-size:13px;color:var(--mu);white-space:pre-wrap;word-break:break-word}
.dt{all:unset;cursor:pointer;font-size:12.5px;color:var(--mu);text-decoration:underline;text-underline-offset:3px;padding:4px 2px}
.dt:focus-visible{outline:2px solid var(--ac)}
textarea{min-height:92px;resize:vertical}
#rep{display:none}
@page{margin:14mm}
@media print{
body{padding:0!important;background:#fff!important;color:#111!important}
body>*:not(#rep){display:none!important}
#rep{display:block;font:11px/1.35 Barlow,Arial,sans-serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#rep .rh{display:flex;gap:14px;align-items:center;border-bottom:3px solid #E8420A;padding-bottom:10px;margin-bottom:12px}
#rep img{height:36px}#rep h1{margin:0;font-size:20px}
#rep .rs{font-size:14px;margin:8px 0 4px}
#rep .rb{height:8px;background:#ddd;border-radius:9px;overflow:hidden;margin-bottom:10px}
#rep .rb i{display:block;height:100%;background:#E8420A}
#rep h2{font-size:13px;margin:14px 0 4px;break-after:avoid}
#rep table{width:100%;border-collapse:collapse}
#rep th,#rep td{border-bottom:1px solid #ddd;padding:3px 5px;text-align:left;vertical-align:top}
#rep th{background:#f2f2f2}#rep tr{break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gt">
<form id="gf">
<img src="logo.png" alt="WPS">
<h2 id="gt">Identificação</h2>
<div class="mut">Para editar, informe seu nome e e-mail. Eles ficam registrados em cada alteração, e você recebe os relatórios de progresso.</div>
<label>Nome completo<input type="text" id="gn" autocomplete="name" required></label>
<label>E-mail<input type="email" id="ge" autocomplete="email" inputmode="email" required></label>
<div class="er" id="gerr" role="alert"></div>
<div class="acts"><button class="btn">Continuar</button><button type="button" class="btn sec" id="gc">Agora não</button></div>
</form>
</div>

<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh_t">
<form id="sf">
<h2 id="sh_t"></h2>
<label>Responsável<input type="text" id="sh_o" list="tl" maxlength="60" autocomplete="off"></label>
<label>Prazo<input type="date" id="sh_d"></label>
<label>Observação<textarea id="sh_n" maxlength="500"></textarea></label>
<div class="er" id="sh_e" role="alert"></div>
<div class="acts"><button class="btn">Salvar</button><button type="button" class="btn sec" id="sh_c">Cancelar</button></div>
</form>
</div>

<header id="hd">
<div class="r1"><img src="logo.png" alt="WPS"><h1>Implantação RioSul</h1><span id="pct">0%</span><button class="tg" id="tg" aria-label="Alternar tema"></button></div>
<div class="hp"><i id="hpi"></i></div>
<nav aria-label="Seções do aplicativo">
<button data-v="c" aria-current="page">Checklist</button><button data-v="r">Resumo</button><button data-v="h">Histórico</button><button data-v="e">Equipe</button>
</nav>
</header>

<main>
<section id="v-c" class="v">
<div id="ro" class="card"><span>Modo leitura. Identifique-se para editar.</span><button class="btn" id="ri">Entrar</button></div>
<div class="card">
<h2>Servidor</h2>
<div class="cfg">
<label>IP do servidor<input id="cfg_ip" type="text" inputmode="decimal" placeholder="10.0.0.100" autocomplete="off" aria-describedby="ipe"><div class="er" id="ipe" role="alert"></div></label>
<label>Versão do ParkingPlus<input id="cfg_ver" type="text" placeholder="7.554.1" maxlength="30" autocomplete="off"></label>
</div>
</div>
<div class="bar"><input type="search" id="q" placeholder="Buscar item" aria-label="Buscar item"><button class="chip" id="only" aria-pressed="false">Só pendentes</button><button class="chip" id="late" aria-pressed="false">Atrasados</button></div>
<div class="tools"><button id="ex">Expandir tudo</button><button id="co">Recolher tudo</button><span class="live" id="live" data-s="" aria-live="polite">Conectando</span></div>
<div id="app"></div>
</section>
<section id="v-r" class="v" hidden></section>
<section id="v-h" class="v" hidden><div class="card" id="hist"></div></section>
<section id="v-e" class="v" hidden><div class="card" id="team"></div></section>
</main>
<div id="toast" hidden role="status" aria-live="polite"></div>
<datalist id="tl"></datalist>
<div id="rep" aria-hidden="true"></div>

<script>
const SB_URL=(window.CFG&&CFG.url)||"COLE_AQUI",SB_KEY=(window.CFG&&CFG.key)||"COLE_AQUI";
const LB={p:"Pendente",a:"Em andamento",w:"Aguardando",d:"Concluído",n:"N/A"};
const KL={cfg_ip:"o IP do servidor",cfg_ver:"a versão do ParkingPlus"};
const ipRe=/^((25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(25[0-5]|2[0-4]\d|1?\d?\d)$/;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=s=>String(s).replace(/^[^A-Za-zÀ-ÿ0-9]+/,"");
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const fd=x=>new Date(x).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const dm=d=>d.split("-").reverse().join("/");
const tdy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let user=null;try{user=JSON.parse(ls.get("user")||"null")}catch(e){}
let items=[],secs=[],els={},st={},by={},ts={},lab={},log=[],mem=[],pend=null,tt=0,nt={};
const db=(window.supabase&&!SB_URL.startsWith("COLE"))?supabase.createClient(SB_URL,SB_KEY):null;
const SUN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>';
const MOON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';

function setTh(t){document.documentElement.dataset.theme=t;ls.set("tema",t);$("tg").innerHTML=t==="dark"?SUN:MOON;document.querySelector("meta[name=theme-color]").content=t==="dark"?"#0c0d0f":"#ffffff"}
setTh(ls.get("tema")||"dark");
$("tg").onclick=()=>setTh(document.documentElement.dataset.theme==="dark"?"light":"dark");
function setLive(s,t){const e=$("live");e.dataset.s=s;e.textContent=t}

function toast(msg,undo){
  const t=$("toast");t.innerHTML="";const s=document.createElement("span");s.textContent=msg;t.append(s);
  if(undo){const b=document.createElement("button");b.textContent="Desfazer";b.onclick=()=>{t.hidden=true;undo()};t.append(b)}
  t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,7000);
}

function auth(){$("ro").hidden=!!user;showTeam()}
function openGate(){$("gerr").textContent="";$("gate").hidden=false;$("gn").focus()}
function closeGate(){$("gate").hidden=true;pend=null;if(db)loadCfg()}
function need(fn){if(user)fn();else{pend=fn;openGate()}}
$("gc").onclick=closeGate;$("ri").onclick=openGate;
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("sheet").hidden)$("sheet").hidden=true;else if(!$("gate").hidden)closeGate()});
$("gf").onsubmit=async e=>{
  e.preventDefault();
  const name=$("gn").value.trim(),email=$("ge").value.trim().toLowerCase();
  if(name.length<2||!/^\S+@\S+\.\S+$/.test(email)){$("gerr").textContent="Informe nome e e-mail válidos.";return}
  if(!db){$("gerr").textContent="Sistema ainda não configurado.";return}
  const {error}=await db.rpc("register_member",{p_name:name,p_email:email});
  if(error){$("gerr").textContent="Não foi possível salvar. Tente novamente.";return}
  user={name,email};ls.set("user",JSON.stringify(user));$("gate").hidden=true;auth();loadMem();
  if(pend){const f=pend;pend=null;f()}
};

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x===b?x.setAttribute("aria-current","page"):x.removeAttribute("aria-current"));
  document.querySelectorAll(".v").forEach(v=>v.hidden=v.id!=="v-"+b.dataset.v);
  if(db){if(b.dataset.v==="r")loadMs();if(b.dataset.v==="e")loadMem()}
  window.scrollTo(0,0);
});

async function save(it,s){
  if(!user)return;
  st[it.item_id]=s;by[it.item_id]=user.name;ts[it.item_id]=new Date().toISOString();paint();
  const {error}=await db.from("checklist_status").upsert({item_id:it.item_id,status:s,updated_by:user.name,updated_email:user.email,updated_at:ts[it.item_id]});
  if(error)setLive("err","Não foi possível salvar");
}
function chg(it,s){need(()=>{const p=st[it.item_id];if(p===s)return;save(it,s);toast(clean(it.label)+": "+LB[s],()=>save(it,p))})}

function build(){
  const m=new Map();
  items.forEach(i=>{lab[i.item_id]=i.label;st[i.item_id]=i.initial_status;if(!m.has(i.section))m.set(i.section,[]);m.get(i.section).push(i)});
  m.forEach((arr,name)=>{
    const d=document.createElement("details"),sm=document.createElement("summary");
    sm.innerHTML="<div class='sh'><span class='nm'></span><span class='sc'></span></div><div class='mb'><i></i></div>";
    sm.querySelector(".nm").textContent=clean(name);d.appendChild(sm);
    arr.forEach(it=>{
      const r=document.createElement("div"),b=document.createElement("button"),t=document.createElement("span"),tl=document.createElement("span"),w=document.createElement("small"),sel=document.createElement("select");
      r.className="it";t.className="t";tl.className="tl";tl.textContent=it.label;w.className="w";const ch=document.createElement("div"),cs=document.createElement("span"),dt=document.createElement("button");ch.className="ch";dt.className="dt";dt.textContent="Detalhes";dt.onclick=()=>openSheet(it);ch.append(cs,dt);t.append(tl,w,ch);
      sel.setAttribute("aria-label","Status: "+it.label);
      Object.keys(LB).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=LB[k];sel.appendChild(o)});
      b.className="ck";b.onclick=()=>chg(it,st[it.item_id]==="d"?"p":"d");sel.onchange=()=>chg(it,sel.value);
      r.append(b,t,sel);d.appendChild(r);els[it.item_id]={r,b,sel,w,tl,cs,dt};
    });
    $("app").appendChild(d);secs.push({name,it:arr,d,cnt:sm.querySelector(".sc"),mb:sm.querySelector(".mb i")});
  });
  if(secs[0])secs[0].d.open=true;
}

function paint(){
  if(!secs.length)return;
  const only=$("only").getAttribute("aria-pressed")==="true",lateOnly=$("late").getAttribute("aria-pressed")==="true",tday=tdy(),q=$("q").value.trim().toLowerCase();
  let T=0,D=0,LT=0,sh="";const c={p:0,a:0,w:0,d:0,n:0};
  secs.forEach(sc=>{
    let t=0,d=0,vis=0;
    sc.it.forEach(it=>{
      const s=st[it.item_id],e=els[it.item_id];c[s]++;
      e.r.className="it "+s;e.sel.value=s;
      e.b.setAttribute("aria-label",(s==="d"?"Reabrir: ":"Concluir: ")+it.label);
      e.w.textContent=by[it.item_id]?by[it.item_id]+(ts[it.item_id]?" · "+fd(ts[it.item_id]):""):"";
      const n=nt[it.item_id]||{},isLate=!!(n.due&&n.due<tday&&s!=="d"&&s!=="n");if(isLate)LT++;
      e.cs.innerHTML=(n.owner?"<span class='chip2'>Resp.: "+esc(n.owner)+"</span>":"")+(n.due?"<span class='chip2"+(isLate?" late":"")+"'>"+(isLate?"Atrasado, prazo ":"Prazo ")+dm(n.due)+"</span>":"")+(n.note?"<div class='nt'>"+esc(n.note)+"</div>":"");
      e.dt.textContent=(n.owner||n.due||n.note)?"Editar":"Detalhes";
      const show=(!only||(s!=="d"&&s!=="n"))&&(!lateOnly||isLate)&&(!q||it.label.toLowerCase().includes(q));
      e.r.hidden=!show;if(show)vis++;
      if(s!=="n"){t++;if(s==="d")d++}
    });
    sc.cnt.textContent=d+"/"+t;sc.mb.style.width=(t?d*100/t:0)+"%";sc.d.hidden=!vis;
    if(q&&vis)sc.d.open=true;
    T+=t;D+=d;
    sh+="<div class='sr'><span>"+esc(clean(sc.name))+"</span><span class='sc'>"+d+"/"+t+"</span></div><div class='mb'><i style='width:"+(t?d*100/t:0)+"%'></i></div>";
  });
  const p=T?Math.floor(D*100/T):0;window._tot={T,D,p};
  $("pct").textContent=p+"%";$("hpi").style.width=p+"%";
  $("v-r").innerHTML="<div class='card'><div class='big'>"+p+"%</div><div class='mut' style='margin-top:6px'>"+D+" de "+T+" itens concluídos</div><div class='pb'><i style='width:"+p+"%'></i></div><div class='st4'><div><b>"+c.p+"</b>Pendentes</div><div><b>"+c.a+"</b>Em andamento</div><div><b>"+c.w+"</b>Aguardando</div><div><b>"+LT+"</b>Atrasados</div></div><div class='acts'><button class='btn' id='pdf'>Gerar relatório em PDF</button></div></div><div class='card'><h2>Marcos de e-mail</h2><div id='ms'></div></div><div class='card'><h2>Progresso por seção</h2>"+sh+"</div>";
  if(window._ms)showMs();
}
$("only").onclick=()=>{const b=$("only");b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");paint()};
$("q").oninput=paint;
$("late").onclick=()=>{const b=$("late");b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");paint()};

let cur=null;
function openSheet(it){need(()=>{cur=it;const n=nt[it.item_id]||{};$("sh_t").textContent=it.label;$("sh_o").value=n.owner||"";$("sh_d").value=n.due||"";$("sh_n").value=n.note||"";$("sh_e").textContent="";$("sheet").hidden=false;$("sh_o").focus()})}
$("sh_c").onclick=()=>$("sheet").hidden=true;
$("sf").onsubmit=async e=>{
  e.preventDefault();
  const o=$("sh_o").value.trim().slice(0,60),d=$("sh_d").value||null,n=$("sh_n").value.trim().slice(0,500);
  const row={item_id:cur.item_id,owner:o||null,due:d,note:n||null,updated_by:user.name,updated_email:user.email,updated_at:new Date().toISOString()};
  const {error}=await db.from("checklist_notes").upsert(row);
  if(error){$("sh_e").textContent="Não foi possível salvar.";return}
  nt[cur.item_id]={owner:row.owner,due:row.due,note:row.note};$("sheet").hidden=true;paint();toast("Detalhes salvos");
};

function report(){
  const t=window._tot||{T:0,D:0,p:0};
  let h="<div class='rh'><img src='logo.png' alt='WPS'><div><h1>Implantação RioSul</h1><div>Relatório gerado em "+fd(Date.now())+(user?" por "+esc(user.name):"")+"</div><div>Servidor: "+esc($("cfg_ip").value||"não informado")+" · ParkingPlus: "+esc($("cfg_ver").value||"não informada")+"</div></div></div>";
  h+="<div class='rs'><b>"+t.p+"%</b> concluído · "+t.D+" de "+t.T+" itens</div><div class='rb'><i style='width:"+t.p+"%'></i></div>";
  secs.forEach(sc=>{
    h+="<h2>"+esc(clean(sc.name))+"</h2><table><tr><th>Item</th><th>Status</th><th>Responsável</th><th>Prazo</th><th>Observação</th></tr>";
    sc.it.forEach(it=>{const n=nt[it.item_id]||{};h+="<tr><td>"+esc(it.label)+"</td><td>"+LB[st[it.item_id]]+"</td><td>"+esc(n.owner||"")+"</td><td>"+(n.due?dm(n.due):"")+"</td><td>"+esc(n.note||"")+"</td></tr>"});
    h+="</table>";
  });
  $("rep").innerHTML=h;window.print();
}
$("v-r").onclick=e=>{if(e.target.id==="pdf")report()};
$("ex").onclick=()=>secs.forEach(s=>s.d.open=true);
$("co").onclick=()=>secs.forEach(s=>s.d.open=false);

async function loadMs(){const {data}=await db.from("checklist_milestones").select("*");window._ms=data||[];showMs()}
function showMs(){
  const el=$("ms");if(!el)return;
  el.innerHTML=[50,75,90,100].map(t=>{const m=window._ms.find(x=>x.threshold===t);
    return "<div class='li'><span class='mono'>"+t+"%</span><span class='tag"+(m?" ok":"")+"'>"+(m?"Enviado":"Aguardando")+"</span>"+(m?"<small>"+fd(m.created_at)+"</small>":"")+"</div>"}).join("");
}

const hl=r=>{
  if(r.kind==="note")return "<div class='li'><b>"+esc(r.by_name)+"</b> atualizou “"+esc(lab[r.item_id]||r.item_id)+"”: "+esc(r.value)+"<small>"+fd(r.at)+"</small></div>";
  if(r.item_id.startsWith("cfg_"))return "<div class='li'><b>"+esc(r.by_name)+"</b> alterou "+KL[r.item_id]+" para “"+esc(r.value)+"”<small>"+fd(r.at)+"</small></div>";
  return "<div class='li'><b>"+esc(r.by_name)+"</b> definiu “"+esc(lab[r.item_id]||r.item_id)+"” como "+LB[r.status]+"<small>"+fd(r.at)+"</small></div>";
};
function showLog(){$("hist").innerHTML=log.length?log.map(hl).join(""):"<div class='mut'>Nenhuma alteração registrada.</div>"}
function showTeam(){
  $("team").innerHTML="<h2>Equipe</h2>"+(mem.length?mem.map(m=>"<div class='li'>"+esc(m.name)+(user&&m.name===user.name?"<span class='tag'>Você</span><small>"+esc(user.email)+"</small>":"")+"</div>").join(""):"<div class='mut'>Ninguém cadastrado.</div>")+
   "<div class='acts'>"+(user?"<button class='btn sec' id='sw'>Trocar usuário</button><button class='btn sec' id='lv'>Sair da equipe</button>":"<button class='btn' id='en'>Entrar</button>")+"</div>";
  if(!user){$("en").onclick=openGate;return}
  $("lv").onclick=async()=>{
    if(!confirm("Sair da equipe? Você deixará de receber os relatórios por e-mail."))return;
    const {error}=await db.rpc("leave_team",{p_email:user.email});
    if(error){alert("Não foi possível sair. Tente novamente.");return}
    ls.set("user","null");user=null;$("gn").value="";$("ge").value="";auth();loadMem();
    toast("Você saiu da equipe e não receberá mais e-mails.");
  };
  $("sw").onclick=()=>{ls.set("user","null");user=null;$("gn").value="";$("ge").value="";auth();openGate()};
}
async function loadMem(){const {data}=await db.rpc("team_names");mem=data||[];$("tl").innerHTML=mem.map(m=>"<option value=\""+esc(m.name)+"\">").join("");showTeam()}
async function loadNt(){const {data}=await db.from("checklist_notes").select("*");(data||[]).forEach(r=>{nt[r.item_id]={owner:r.owner,due:r.due,note:r.note}});paint()}
async function loadLog(){const {data}=await db.from("checklist_log").select("*").order("at",{ascending:false}).limit(60);log=data||[];showLog()}
async function loadSt(){const {data}=await db.from("checklist_status").select("*");(data||[]).forEach(r=>{st[r.item_id]=r.status;by[r.item_id]=r.updated_by;ts[r.item_id]=r.updated_at});paint()}
const keys={cfg_ip:$("cfg_ip"),cfg_ver:$("cfg_ver")};
const apc=r=>{const e=keys[r.key];if(e&&document.activeElement!==e)e.value=r.value||""};
async function loadCfg(){const {data}=await db.from("checklist_config").select("*");(data||[]).forEach(apc)}
keys.cfg_ip.oninput=()=>{keys.cfg_ip.removeAttribute("aria-invalid");$("ipe").textContent=""};
Object.entries(keys).forEach(([k,e])=>e.onchange=()=>{
  const v=e.value.trim();
  if(k==="cfg_ip"&&v&&!ipRe.test(v)){e.setAttribute("aria-invalid","true");$("ipe").textContent="IP inválido. Use o formato 10.0.0.100.";return}
  need(async()=>{
    const {error}=await db.from("checklist_config").upsert({key:k,value:v,updated_by:user.name,updated_email:user.email,updated_at:new Date().toISOString()});
    if(error)setLive("err","Não foi possível salvar");else toast("Salvo: "+KL[k].replace(/^o |^a /,""));
  });
});

(async()=>{
  auth();showLog();
  if(!db){setLive("err","Configuração pendente");return}
  const {data,error}=await db.from("checklist_items").select("*").order("pos");
  if(error||!data){setLive("err","Sem conexão");return}
  items=data;build();
  await Promise.all([loadSt(),loadCfg(),loadLog(),loadMem(),loadNt()]);
  db.channel("chk")
   .on("postgres_changes",{event:"*",schema:"public",table:"checklist_status"},p=>{const r=p.new;if(r&&r.item_id){st[r.item_id]=r.status;by[r.item_id]=r.updated_by;ts[r.item_id]=r.updated_at;paint()}})
   .on("postgres_changes",{event:"*",schema:"public",table:"checklist_config"},p=>{if(p.new&&p.new.key)apc(p.new)})
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"checklist_log"},p=>{log.unshift(p.new);log=log.slice(0,60);showLog()})
   .on("postgres_changes",{event:"*",schema:"public",table:"checklist_notes"},p=>{const r=p.new;if(r&&r.item_id){nt[r.item_id]={owner:r.owner,due:r.due,note:r.note};paint()}})
   .subscribe(x=>{if(x==="SUBSCRIBED"){setLive("ok","Ao vivo");loadSt();loadCfg();loadLog();loadNt()}else setLive("","Conectando")});
})();
</script>
</body>
